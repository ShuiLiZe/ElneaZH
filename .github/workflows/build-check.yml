name: build-check

# 分支验证用：只编译，不打 release、不碰 app/keystore 之外的东西。
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile tools/*.py && echo "python ok"
      - name: Offline rules (single-player gate + share/export)
        run: python tools/verify_offline.py
      - name: Offline unit test (real Java on plain JDK)
        run: |
          # 不需要手机的纯逻辑，直接拿 JDK 跑：单机判定 / 本机回包 / 开关 / 说明文案。
          # android.* 由 tools/offline_test/stub 里的极小 stub 顶替。
          mkdir -p build/offtest
          javac -encoding UTF-8 -nowarn -sourcepath inj -d build/offtest \
            $(find tools/offline_test -name '*.java') \
            inj/com/shuilize/elneazh/inj/Offline.java \
            inj/com/shuilize/elneazh/inj/Pinyin.java \
            inj/com/shuilize/elneazh/inj/NameFix.java \
            inj/com/shuilize/elneazh/inj/UploadNames.java \
            inj/com/shuilize/elneazh/inj/OfflineGate.java \
            inj/com/shuilize/elneazh/inj/IdentityKeys.java
          java -cp build/offtest com.shuilize.elneazh.inj.OfflineTest
          java -cp build/offtest com.shuilize.elneazh.inj.PlayerPrefsTest
      - name: Verify base data.unity3d
        run: |
          echo "dc1796ffac62ea29796772f320c4218a922216aa417c4689abaeb6c0e917a155  base/data.unity3d" | sha256sum -c -
      - name: Build localized data.unity3d
        run: |
          mkdir -p build
          FONT=""
          if [ -f fonts/zh.ttf ]; then FONT="--font fonts/zh.ttf --bmfont fonts/zh.ttf"; fi
          python tools/build_patch.py base/data.unity3d build/data.unity3d --tr translations $FONT --images images_zh
      - name: Verify textures and previews
        run: |
          python tools/ci_verify.py base/data.unity3d build/data.unity3d images_zh build/preview
      - name: Patch IL2CPP metadata (hardcoded strings + Chinese name whitelist)
        run: |
          cat base/apk/ElneaKingdom_2.10.7.apk.part* > build/base.apk
          echo "5117bbaaa301ad2e4535280918173da9500cb2c96bab012ce6040bf1a2bcf90c  build/base.apk" | sha256sum -c -
          unzip -p build/base.apk assets/bin/Data/Managed/Metadata/global-metadata.dat > build/meta_orig.dat
          python tools/metadata_zh.py build/meta_orig.dat build/meta_zh.dat --tr translations/metadata_literals.json
      - name: Build no-root payload (names.tsv + so patch + manifest)
        run: |
          Z=app/src/main/assets/elneazh; mkdir -p $Z/Contents $Z/map
          mkdir -p $Z/data && python tools/names_map.py $Z/data/names.tsv
          python tools/pinyin_tables.py
          python tools/verify_names.py
          cp content_zh/Contents/c_* $Z/Contents/
          cp content_zh/map_large_en/__data content_zh/map_large_en/__info $Z/map/
          mkdir -p $Z/bundles && cp content_zh/bundles/*~*.data content_zh/bundles/*~*.info $Z/bundles/
          (cd content_zh/bundles && for f in *~*.data; do n=${f%.data}; printf '%s\t%s\t%s\n' "${n%%~*}" "${n#*~}" "$(stat -c %s "$f")"; done) > $Z/bundles/index.tsv
          unzip -p build/base.apk lib/arm64-v8a/libil2cpp.so > build/libil2cpp.so
          python tools/so_patch_zh.py build/libil2cpp.so $Z/so.elsp
          unzip -p build/base.apk AndroidManifest.xml > build/manifest_orig.axml
          sha256sum build/manifest_orig.axml | cut -d' ' -f1 > $Z/manifest_base.sha256
          python tools/manifest_zh.py build/manifest_orig.axml $Z/AndroidManifest.xml
      - name: Build native name gate (libelneagate.so, arm64-v8a + armeabi-v7a)
        run: |
          python tools/build_gate.py
          python tools/verify_gate.py
          ls -la app/src/main/assets/elneagate/*/
      - name: Verify native .so is shipped into the game APK (payload chain + load path)
        run: |
          mkdir -p app/src/main/assets/elneazh/elneagate
          cp -r app/src/main/assets/elneagate/lib* app/src/main/assets/elneazh/elneagate/
          python tools/verify_native_load.py
      - name: Compile injected Java (classes3.dex sources)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)
          echo "build-tools $BT platform $PLAT"
          mkdir -p build/inj
          javac -Xlint:all --release 8 -cp $PLAT/android.jar -d build/inj $(find inj -name '*.java')
          $BT/d8 --min-api 21 --lib $PLAT/android.jar --output build/inj $(find build/inj -name '*.class')
          ls -la build/inj/classes.dex
      - name: Verify injected logic offline (wipe rules + upload name filter)
        run: |
          python tools/verify_identity.py
          python tools/verify_upload_names.py
      - name: Build APK (no release)
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Collect APK
        run: |
          mkdir -p dist && cp app/build/outputs/apk/release/*.apk dist/ElneaZH-branch.apk && ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ElneaZH-branch-apk
          path: dist/ElneaZH-branch.apk
