name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false  # translations are pushed often; let a run finish, newest push waits

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Verify base data.unity3d
        run: |
          echo "dc1796ffac62ea29796772f320c4218a922216aa417c4689abaeb6c0e917a155  base/data.unity3d" | sha256sum -c -

      - name: Build localized data.unity3d
        run: |
          mkdir -p build
          FONT=""
          if [ -f fonts/zh.ttf ]; then FONT="--font fonts/zh.ttf --bmfont fonts/zh.ttf"; fi
          python tools/build_patch.py base/data.unity3d build/data.unity3d --tr translations $FONT --images images_zh

      - name: Verify textures and make previews
        run: python tools/ci_verify.py base/data.unity3d build/data.unity3d images_zh build/preview

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview
          path: build/preview

      - name: Patch IL2CPP metadata (hardcoded strings + Chinese-name whitelist)
        run: |
          cat base/apk/ElneaKingdom_2.10.7.apk.part* > build/base.apk
          echo "5117bbaaa301ad2e4535280918173da9500cb2c96bab012ce6040bf1a2bcf90c  build/base.apk" | sha256sum -c -
          unzip -p build/base.apk assets/bin/Data/Managed/Metadata/global-metadata.dat > build/meta_orig.dat
          python tools/metadata_zh.py build/meta_orig.dat build/meta_zh.dat --tr translations/metadata_literals.json

      - name: Create patch
        run: |
          python tools/make_patch.py base/data.unity3d build/data.unity3d app/src/main/assets \
            "补丁 #${{ github.run_number }} · ${GITHUB_SHA::7}"
          python - <<'PY'
          import bsdiff4, hashlib, json
          d = 'app/src/main/assets'
          bsdiff4.file_diff('build/meta_orig.dat', 'build/meta_zh.dat', d + '/elnea_meta.patch')
          bsdiff4.file_patch('build/meta_orig.dat', 'build/meta_check.dat', d + '/elnea_meta.patch')
          h = lambda p: hashlib.sha256(open(p, 'rb').read()).hexdigest()
          assert h('build/meta_check.dat') == h('build/meta_zh.dat')
          info = json.load(open(d + '/elnea_zh.json'))
          info['meta_base_sha256'] = h('build/meta_orig.dat'); info['meta_new_sha256'] = h('build/meta_zh.dat')
          json.dump(info, open(d + '/elnea_zh.json', 'w'), ensure_ascii=False, indent=1)
          print('meta patch ok', info)
          PY
          ls -la app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); AGP fetches missing platforms itself.
      - uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ElneaZH.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ElneaZH-apk
          path: dist/ElneaZH.apk

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="自动构建 #${{ github.run_number }}（${GITHUB_SHA::7}）。下载 ElneaZH.apk 安装到手机，打开后按步骤一键汉化。"
          git tag -f latest
          git push -f origin latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "艾尔尼亚汉化器（最新构建）" --notes "$NOTES" --prerelease=false
            gh release upload latest dist/ElneaZH.apk --clobber
          else
            gh release create latest dist/ElneaZH.apk --title "艾尔尼亚汉化器（最新构建）" --notes "$NOTES" --latest
          fi
