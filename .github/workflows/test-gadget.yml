# Test-only build of the localized game with frida-gadget inside (no root, no PC needed).
#
# Triggered by hand (workflow_dispatch) or by pushing a tag named `test-gadget-*`.
# It runs the same payload steps as build.yml but WITHOUT the translation build (so it is fast
# and small: the game keeps downloading its resources), then repacks the base APK with the
# ELSP il2cpp patch, the patched manifest, classes3.dex from inj/, and
# libfrida-gadget.so + libgadget.config.so + assets/elneazh/libhook.js.
#
# Output: an artifact plus a PRE-release on the pushed tag (never --latest). Never touches main.
name: test-gadget build

on:
  workflow_dispatch:
  push:
    tags:
      - 'test-gadget-*'

permissions:
  contents: write

jobs:
  gadget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Python deps
        run: pip install -r requirements.txt

      # base/apk is read-only input: the four part files are the stored base APK, checksum-gated.
      - name: Assemble base APK from base/apk (read-only)
        run: |
          mkdir -p build
          cat base/apk/ElneaKingdom_2.10.7.apk.part* > build/base.apk
          echo "5117bbaaa301ad2e4535280918173da9500cb2c96bab012ce6040bf1a2bcf90c  build/base.apk" | sha256sum -c -

      - name: Build no-root payload (tables + map + bundles + il2cpp + manifest)
        run: |
          Z=app/src/main/assets/elneazh; mkdir -p $Z/Contents $Z/map $Z/data
          python tools/names_map.py $Z/data/names.tsv
          cp content_zh/Contents/c_* $Z/Contents/
          cp content_zh/map_large_en/__data content_zh/map_large_en/__info $Z/map/
          mkdir -p $Z/bundles && cp content_zh/bundles/*~*.data content_zh/bundles/*~*.info $Z/bundles/
          (cd content_zh/bundles && for f in *~*.data; do n=${f%.data}; printf '%s\t%s\t%s\n' "${n%%~*}" "${n#*~}" "$(stat -c %s "$f")"; done) > $Z/bundles/index.tsv
          unzip -p build/base.apk lib/arm64-v8a/libil2cpp.so > build/libil2cpp.so
          python tools/so_patch_zh.py build/libil2cpp.so $Z/so.elsp
          unzip -p build/base.apk AndroidManifest.xml > build/manifest_orig.axml
          sha256sum build/manifest_orig.axml | cut -d' ' -f1 > $Z/manifest_base.sha256
          python tools/manifest_zh.py build/manifest_orig.axml $Z/AndroidManifest.xml

      - name: Compile injection classes (classes3.dex)
        run: |
          PLAT=$ANDROID_HOME/platforms/$(ls $ANDROID_HOME/platforms | tail -1)
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          mkdir -p build/inj build/dex
          javac --release 8 -cp $PLAT/android.jar -d build/inj $(find inj -name '*.java')
          $BT/d8 --min-api 21 --output build/dex $(find build/inj -name '*.class')
          cp build/dex/classes.dex build/classes3.dex
          ls -l build/classes3.dex

      # frida 16.7.19 is the last line whose gadget still starts on the ART versions this game targets.
      - name: Fetch frida-gadget 16.7.19
        run: |
          V=16.7.19
          mkdir -p build/gadget
          for abi in arm64 arm; do
            curl -fsSL -o build/gadget/$abi.xz \
              https://github.com/frida/frida/releases/download/$V/frida-gadget-$V-android-$abi.so.xz
            xz -dc build/gadget/$abi.xz > build/gadget/libfrida-gadget-$abi.so
          done
          ls -l build/gadget

      - name: Repack + sign test APK
        run: |
          python tools/make_gadget_apk.py build/base.apk build/app-elneazh-test-gadget.apk \
            --so-patch app/src/main/assets/elneazh/so.elsp \
            --manifest app/src/main/assets/elneazh/AndroidManifest.xml \
            --dex build/classes3.dex \
            --gadget-arm64 build/gadget/libfrida-gadget-arm64.so \
            --gadget-arm build/gadget/libfrida-gadget-arm.so \
            --hook tools/gadget_hook.js
          ls -l build/app-elneazh-test-gadget.apk
          sha256sum build/app-elneazh-test-gadget.apk | tee build/apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: app-elneazh-test-gadget
          path: |
            build/app-elneazh-test-gadget.apk
            build/apk.sha256
          compression-level: 0

      # Phone-friendly: a pre-release on the test tag. Deliberately NOT --latest, so it can never
      # become the "latest" download for normal users.
      - name: Publish pre-release (test tag only)
        if: startsWith(github.ref, 'refs/tags/test-gadget-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true
          gh release create "$GITHUB_REF_NAME" \
            --title "测试版（仅排查用）" \
            --notes "排查加密用，采样完装回正式版。" \
            --prerelease \
            build/app-elneazh-test-gadget.apk build/apk.sha256
          gh release view "$GITHUB_REF_NAME" --json assets,url --jq '{url: .url, assets: [.assets[] | {name: .name, size: .size}]}'
